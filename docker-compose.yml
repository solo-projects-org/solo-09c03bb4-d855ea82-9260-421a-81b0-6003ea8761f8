services:
  api-a:
    build: .
    image: rainfall-prob-api:latest
    ports:
      - "8081:8000"
    environment:
      RAIN_DB_PATH: /data/rainfall.db
      RAIN_BUSY_TIMEOUT_MS: "10000"
    volumes:
      - rain-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api-b:
    image: rainfall-prob-api:latest
    build: .
    ports:
      - "8082:8000"
    environment:
      RAIN_DB_PATH: /data/rainfall.db
      RAIN_BUSY_TIMEOUT_MS: "10000"
    volumes:
      - rain-data:/data
    depends_on:
      api-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  rain-data:
